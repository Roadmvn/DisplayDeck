name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/DisplayDeck.dmg build/DisplayDeck.dmg.sha256 \
            --title "DisplayDeck $GITHUB_REF_NAME" \
            --generate-notes
