name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# un seul run à la fois : deux pushes rapprochés calculeraient la même version
concurrency:
  group: release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick the next version
        id: version
        run: ./scripts/next-version.sh >> "$GITHUB_OUTPUT"

      - name: Install dmgbuild
        if: steps.version.outputs.tag != ''
        run: pipx install dmgbuild==1.6.7

      - name: Build DMG
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Verify bundle
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-bundle.sh

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            build/DisplayDeck.dmg build/DisplayDeck.dmg.sha256 \
            --target "$GITHUB_SHA" \
            --title "DisplayDeck $TAG" \
            --generate-notes
