name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install dmgbuild
        run: pipx install dmgbuild==1.6.7

      - name: Build app and DMG
        run: ./scripts/make-dmg.sh

      - name: Verify bundle
        run: ./scripts/verify-bundle.sh

      - uses: actions/upload-artifact@v7
        with:
          name: DisplayDeck-dmg
          path: |
            build/DisplayDeck.dmg
            build/DisplayDeck.dmg.sha256
          if-no-files-found: error
